name: controle-ecoute
# Contrôle d'écoute indépendant : chaque extrait déposé dans controles/ (mp3) est transcrit par Whisper large-v3
# (modèle plus fort que celui de la chaîne de production) et par Vosk (autre famille de modèle, qui écrit les
# nombres en toutes lettres : utile pour « quatre-vingt ») ; le texte est écrit à côté (même nom, .txt).
on:
  push:
    branches: [essai-voix]
    paths: ["controles/**.mp3"]
permissions:
  contents: write
jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper vosk
          curl -sSL -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip && unzip -q /tmp/vosk.zip -d /tmp/vosk
      - name: Transcription
        run: |
          python - <<'PY'
          import glob, os, subprocess
          import numpy as np
          from faster_whisper import WhisperModel
          m = WhisperModel("large-v3", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("controles/*.mp3")):
              out = f[:-4] + ".txt"
              if os.path.exists(out):
                  continue
              pcm = subprocess.run(["ffmpeg", "-v", "error", "-i", f, "-ac", "1", "-ar", "16000", "-f", "f32le", "-"],
                                   capture_output=True, check=True).stdout
              a = np.frombuffer(pcm, np.float32)
              res = []
              for beam, prompt in ((5, None), (5, "Transcription en toutes lettres, nombres écrits en chiffres.")):
                  segs, _ = m.transcribe(a, language="fr", beam_size=beam, initial_prompt=prompt, word_timestamps=True)
                  segs = list(segs)
                  res.append(" ".join(s.text.strip() for s in segs) + "\n  mots : " +
                             " | ".join(f"{w.word.strip()}[{w.start:.2f}-{w.end:.2f}]" for s in segs for w in (s.words or [])))
              try:
                  import json as _j
                  from vosk import Model, KaldiRecognizer
                  vm = Model(glob.glob("/tmp/vosk/*")[0])
                  rec = KaldiRecognizer(vm, 16000)
                  rec.SetWords(True)
                  pcm16 = (np.clip(a, -1, 1) * 32767).astype("<i2").tobytes()
                  rec.AcceptWaveform(pcm16)
                  r = _j.loads(rec.FinalResult())
                  res.append("VOSK : " + r.get("text", "") + "\n  mots : " + " | ".join(
                      f"{w['word']}[{w['start']:.2f}-{w['end']:.2f}]" for w in r.get("result", [])))
              except Exception as e:  # noqa: BLE001
                  res.append(f"VOSK : échec ({e})")
              open(out, "w", encoding="utf-8").write("\n".join(res) + "\n")
              print(f, "->", res[0].splitlines()[0])
          PY
      - name: Dépôt
        if: always()
        run: |
          git config user.name "controle-ecoute (GitHub Actions)"
          git config user.email "actions@github.com"
          git add -A controles
          git commit -q -m "controle-ecoute : transcriptions" || exit 0
          for i in 1 2 3 4 5; do git push -q origin HEAD:essai-voix && break; git pull -q --rebase origin essai-voix; sleep 5; done
